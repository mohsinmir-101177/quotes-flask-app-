<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>2-Tier Quotes App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background: #f4f4f9; }
        .card { background: white; padding: 20px; display: inline-block; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        ul { list-style-type: none; padding: 0; }
        li { margin: 10px 0; font-size: 1.2em; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📜 Daily Quotes</h2>
        <ul id="quotes-list">Loading...</ul>
    </div>

    <script>
        // Backend API se quotes mangwana
        fetch('/api/quotes')
            .then(response => response.json())
            .then(data => {
                const list = document.getElementById('quotes-list');
                list.innerHTML = '';
                data.forEach(quote => {
                    const li = document.createElement('li');
                    li.textContent = `"${quote}"`;
                    list.appendChild(li);
                });
            })
            .catch(err => console.error('Error fetching quotes:', err));
    </script>
</body>
</html>
